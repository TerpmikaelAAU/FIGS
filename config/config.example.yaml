# =============================================================================
# Copy to config/config.yaml (git-ignored, so your genomes stay out of the
# repo). One entry per genome. The key is the genome's name in results/<name>/.
#   fasta:   path to your assembly, or leave it out and use an NCBI assembly
#            accession as the key to download that assembly
#   species: required; strain, locus_tag, busco_lineage and the NCBI keys
#            are optional
# Tool settings have defaults in workflow/defaults.yaml; repeat a setting
# here to change it. Per-genome keys are listed in README.md.
# =============================================================================
genomes:
